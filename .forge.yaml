# Generated by `forge init` — deterministic repository-policy discovery.
# No LLM was involved. Review any "TODO" markers below before running forge;
# forge does not guess at a value it cannot confirm from the repository.
#
# found agent instructions: AGENTS.md, CLAUDE.md

version: 1
tracker:
    type: github
    skip_auth_preflight: false
git:
    base: origin/main
    branch_template: forge/{execution}/{issue}
    worktree_root: .forge/worktrees
execution:
    max_parallel: 4
retry:
    gate: 3
    review: 2
    ci: 3
workflow:
    implementation: tdd
    review: true
    review_rubrics:
        docs: rubrics/docs_rubric.md
quality:
    gates:
        - name: test
          command: go test ./...
        - name: lint
          command: go tool golangci-lint run
        - name: format-check
          command: gofmt -l .
        - name: typecheck
          command: go vet ./...
        - name: build
          command: go build ./...
    max_output_bytes: 20000
pull_requests:
    enabled: true
    watch_ci: true
    commit_message_template: |-
        {type}: {title}

        {body}

        Refs #{issue}
ci:
    required_checks:
        mode: github
        checks: []
    poll_interval: 30s
    max_output_bytes: 4000
blocked:
    label: needs-info
    comment: true
agent:
#    provider: claude-code
    permission_mode: bypassPermissions
    provider: codex
    timeout: 20m0s
dependencies:
    overrides: {}
status_reflection:
    enabled: false
    in_progress_label: in-progress
    in_review_label: in-review
    failed_label: failed
    comment: false
lsp:
    enabled: false
    servers: {}
    extensions: {}
    capabilities: {}
    providers: {}
    readiness_timeout: 30s
    restart_limit: 1
    max_results: 50
